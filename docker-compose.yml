
version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: hansoom-mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: hansoom
      TZ: Asia/Seoul
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: hansoom-redis
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: hansoom-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  mariadb_data:
  elasticsearch_data:
