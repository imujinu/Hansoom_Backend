```yaml
version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: hansoom-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: hansoom
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: hansoom-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mariadb_data:

